name: Black Flag provider release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (v0.1.6-bfd.N)
        required: true
        default: v0.1.6-bfd.2
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build and release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v0\.1\.6-bfd\.[0-9]+$ ]]
          mkdir -p build release
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -mod=vendor -trimpath \
              -ldflags "-s -w -X github.com/cloudbase/garm-provider-aws/provider.Version=$VERSION" \
              -o build/garm-provider-aws .
            tar -czf "release/garm-provider-aws-linux-$arch.tgz" -C build garm-provider-aws
            (cd release && sha256sum "garm-provider-aws-linux-$arch.tgz" > "garm-provider-aws-linux-$arch.tgz.sha256")
          done
          gh release create "$VERSION" release/* --target "$GITHUB_SHA" --title "$VERSION" --notes 'Black Flag provider: immediate capacity fallback and persistent launch caches. See BFD_CHANGES.md.'
